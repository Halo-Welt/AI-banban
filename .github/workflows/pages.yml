name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject model key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 - << 'PY'
import json, os, pathlib, sys
key = os.environ.get("DEEPSEEK_API_KEY", "")
if not key:
    sys.exit("DEEPSEEK_API_KEY secret is empty")
path = pathlib.Path("js/ai.js")
text = path.read_text()
needle = 'apiKey: ""'
if needle not in text:
    sys.exit("apiKey placeholder missing in js/ai.js")
path.write_text(text.replace(needle, "apiKey: " + json.dumps(key), 1))
PY

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
